# Channel-reallocation ablation: keep MobileNetV2 W0.625 and P3=64; P4=96, P5=192.
# Adaptation/SPPF/neck channels change together. Detect takes the new input widths.
# Explicit channels: do NOT apply global width 0.625.
nc: 2
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  - [-1, 1, MobileNetV2Backbone, [0.625]] # 0: P3=24, P4=64, P5=200
  - [0, 1, Index, [24, 0]]               # 1: stride 8
  - [-1, 1, Conv, [64, 1, 1]]            # 2: P3 adapter
  - [0, 1, Index, [64, 1]]               # 3: stride 16
  - [-1, 1, Conv, [96, 1, 1]]            # 4: P4 adapter
  - [0, 1, Index, [200, 2]]              # 5: stride 32
  - [-1, 1, Conv, [192, 1, 1]]           # 6: P5 adapter
  - [-1, 1, SPPF, [192, 5]]             # 7: SPPF with reduced channels

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 8
  - [[-1, 4], 1, Concat, [1]]                # 9
  - [-1, 1, C2f, [96]]                       # 10
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 11
  - [[-1, 2], 1, Concat, [1]]                # 12
  - [-1, 1, C2f, [64]]                       # 13: P3
  - [-1, 1, Conv, [64, 3, 2]]               # 14
  - [[-1, 10], 1, Concat, [1]]               # 15
  - [-1, 1, C2f, [96]]                       # 16: P4
  - [-1, 1, Conv, [96, 3, 2]]               # 17
  - [[-1, 7], 1, Concat, [1]]                # 18
  - [-1, 1, C2f, [192]]                      # 19: P5
  - [[13, 16, 19], 1, Detect, [nc]]          # 20
