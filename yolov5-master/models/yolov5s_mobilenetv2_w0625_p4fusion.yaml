# MobileNetV2-YOLOv5s W0.625 with a plain P4-to-P3 fusion control branch

nc: 80
depth_multiple: 0.33
width_multiple: 0.625
anchors:
  - [10, 13, 16, 30, 33, 23]
  - [30, 61, 62, 45, 59, 119]
  - [116, 90, 156, 198, 373, 326]

backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [32, 3, 2]], # 0-P1/2
    [-1, 1, MobileNetV2Block, [32, 1, 1]], # 1
    [-1, 1, MobileNetV2Block, [64, 2, 6]], # 2-P2/4
    [-1, 2, MobileNetV2Block, [64, 1, 6]], # 3
    [-1, 1, MobileNetV2Block, [128, 2, 6]], # 4-P3/8
    [-1, 3, MobileNetV2Block, [128, 1, 6]], # 5
    [-1, 1, MobileNetV2Block, [256, 2, 6]], # 6-P4/16
    [-1, 4, MobileNetV2Block, [256, 1, 6]], # 7
    [-1, 1, MobileNetV2Block, [512, 2, 6]], # 8-P5/32
    [-1, 2, MobileNetV2Block, [512, 1, 6]], # 9
    [-1, 1, SPPF, [512, 5]], # 10
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 7], 1, Concat, [1]],
    [-1, 3, C3, [256, False]], # 14 P4

    [-1, 1, Conv, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 5], 1, Concat, [1]],
    [-1, 3, C3, [128, False]], # 18 P3

    [14, 1, Conv, [128, 1, 1]], # 19 project P4 to P3 channels
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 20 align P4 to P3 resolution
    [[18, -1], 1, Concat, [1]], # 21 plain P4-to-P3 fusion
    [-1, 1, C3, [128, False]], # 22 fused P3 control feature

    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 15], 1, Concat, [1]],
    [-1, 3, C3, [256, False]], # 25 P4

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 11], 1, Concat, [1]],
    [-1, 3, C3, [512, False]], # 28 P5

    [[22, 25, 28], 1, Detect, [nc, anchors]],
  ]
